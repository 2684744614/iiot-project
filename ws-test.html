<!DOCTYPE html>
<html>
<head>
    <title>WebSocket 实时数据测试</title>
    <!-- 引入 SockJS 和 STOMP 客户端库 -->
    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
</head>
<body style="background: #1e1e1e; color: #00ff00; font-family: Consolas, monospace; padding: 20px;">
    <h2>设备实时数据监控（1号电机）</h2>
    <div id="output" style="border: 1px solid #333; padding: 10px; height: 400px; overflow-y: auto; background: #000;">
        <!-- 数据会在这里滚动出现 -->
    </div>

    <script>
        // 连接你的本地 Spring Boot 的 WebSocket 端点
        const socket = new SockJS('http://localhost:8080/ws');
        const stompClient = Stomp.over(socket);
        // 关闭 STOMP 的调试信息，保持控制台干净
        stompClient.debug = null; 

        stompClient.connect({}, function (frame) {
            document.getElementById('output').innerHTML += '<div style="color: #fff;">✅ 已成功连接到 Spring Boot WebSocket！</div>';
            
            // 订阅 1 号设备的主题
            stompClient.subscribe('/topic/device/1', function (message) {
                const data = JSON.parse(message.body);
                const time = new Date().toLocaleTimeString();
                
                // 打印数据到屏幕上
                document.getElementById('output').innerHTML += 
                    `<div>[${time}] 设备: ${data.deviceName} | 温度: ${data.temperature}℃ | 振动: ${data.vibration}mm/s</div>`;
                
                // 让滚动条自动滚到底部
                const outputDiv = document.getElementById('output');
                outputDiv.scrollTop = outputDiv.scrollHeight;
            });
        }, function(error) {
            document.getElementById('output').innerHTML += `<div style="color: red;">❌ 连接失败: ${error}</div>`;
        });
    </script>
</body>
</html>
