services:
  mysql:
    image: mysql:8.0
    container_name: iiot-mysql
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: iiot_monitor
    volumes:
      - ./mysql_data:/var/lib/mysql

  redis:
    image: redis:7-alpine
    container_name: iiot-redis
    ports:
      - "6379:6379"
    command: redis-server --requirepass redis123

  pgvector:
    image: pgvector/pgvector:pg16
    container_name: iiot-pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: iiot_vector
    volumes:
      - ./pgvector_data:/var/lib/postgresql/data

  emqx:
    image: emqx/emqx:5.8
    container_name: iiot-emqx
    ports:
      - "1883:1883"
      - "18083:18083"